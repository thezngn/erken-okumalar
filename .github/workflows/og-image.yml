name: Paylaşım görselini üret

on:
  push:
    paths:
      - "templates/og-card.html"
      - ".github/workflows/og-image.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Görseli çiz (gerçek web yazı tipleriyle)
        run: |
          google-chrome --headless=new --no-sandbox --hide-scrollbars \
            --window-size=1200,630 --virtual-time-budget=8000 \
            --screenshot="$PWD/images/og.png" "file://$PWD/templates/og-card.html"
          python3 -c "import struct;d=open('images/og.png','rb').read(24);print('boyut',struct.unpack('>II',d[16:24]))"
      - name: Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/og.png
          git diff --cached --quiet || (git commit -m "Paylaşım görseli güncellendi" && ok=0; for i in 1 2 3 4 5; do if git pull --rebase -q && git push; then ok=1; break; fi; echo "çakışma, yeniden deneniyor ($i)"; sleep $((i*4)); done; [ $ok = 1 ])
