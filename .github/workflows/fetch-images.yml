name: Fotoğrafları indir

on:
  push:
    paths:
      - "images.json"
      - "scripts/fetch_images.py"
      - ".github/workflows/fetch-images.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fotoğrafları indir
        run: python scripts/fetch_images.py

      - name: Yeni dosyaları depoya işle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images
          if git diff --cached --quiet; then
            echo "Yeni görsel yok."
            exit 0
          fi
          git commit -m "Fotoğrafları indir"
          git push

      - name: Pages yeniden derlensin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages derlemesi tetiklenemedi, kendi kendine tetiklenmesi beklenir."
