name: Zamanlı çalışma testi (geçici)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "$(date -u +%FT%TZ) zamanlı çalışma tetiklendi" >> yayin/nabiz.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yayin/nabiz.log
          git commit -m "Nabız: zamanlı iş akışı çalıştı"
          for i in 1 2 3; do git pull --rebase -q && git push && break || sleep 5; done
