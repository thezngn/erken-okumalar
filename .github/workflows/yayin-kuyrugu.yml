name: Yayın kuyruğu

# Zamanı gelmiş yazıları yayınlar. Bilgisayar ya da oturum gerekmez.
# Asıl tetikleyici: her sabah 07:45 (İstanbul) Claude'un zamanlanmış görevi bu iş akışını
# workflow_dispatch ile başlatır. GitHub'ın kendi zamanlayıcısı bu depoda saatlerce gecikti ya da
# hiç çalışmadı, o yüzden aşağıdaki schedule satırları sadece yedek. Geç gelseler de zararsızdır:
# betik zamanı gelmemiş ya da zaten yayında olan yazıya dokunmaz.
# Dakikalar saat başından uzak seçildi (GitHub saat başlarında daha çok geciktiriyor).
on:
  schedule:
    - cron: "47 4 * * *"
    - cron: "13,37 5 * * *"
    - cron: "17,43 6 * * *"
    - cron: "23 7,8,9,11,14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: yayin-kuyrugu
  cancel-in-progress: false

jobs:
  yayin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zamanı gelenleri yayınla
        id: yay
        run: |
          out=$(python3 scripts/yayin_kuyrugu.py)
          echo "yayinlanan=$out" >> "$GITHUB_OUTPUT"
      # Bu iş akışının push'u site-js.yml'yi tetiklemez (GITHUB_TOKEN kuralı), bu yüzden
      # sayaç (GoatCounter), site.js ve bağlantı önizleme etiketleri yayından önce burada eklenir.
      - name: Sayaç, site.js ve önizleme etiketlerini tamamla
        if: steps.yay.outputs.yayinlanan != ''
        run: |
          python3 scripts/ensure_site_js.py
          python3 scripts/ensure_og.py
          for s in ${{ steps.yay.outputs.yayinlanan }}; do
            grep -q 'gc.zgo.at/count.js' "$s.html" || { echo "::error::$s.html sayaçsız kaldı"; exit 1; }
          done
      - name: Kaydet ve bildirimleri başlat
        if: steps.yay.outputs.yayinlanan != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Zamanlı yayın: ${{ steps.yay.outputs.yayinlanan }}"
          ok=0; for i in 1 2 3 4 5; do if git pull --rebase -q && git push; then ok=1; break; fi; sleep $((i*4)); done; [ $ok = 1 ]
          gh workflow run notify.yml
          gh workflow run email.yml -f check=false
