name: Ortak betiği sayfalara ekle

on:
  push:
    paths:
      - "*.html"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/ensure_site_js.py
      - run: python scripts/ensure_og.py
      - name: Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "*.html"
          git diff --cached --quiet || (git commit -m "site.js eksik sayfalara eklendi" && ok=0; for i in 1 2 3 4 5; do if git pull --rebase -q && git push; then ok=1; break; fi; echo "çakışma, yeniden deneniyor ($i)"; sleep $((i*4)); done; [ $ok = 1 ])
