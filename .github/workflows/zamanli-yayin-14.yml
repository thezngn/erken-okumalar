name: Zamanlı yayın (14 Kasım 07:45)

on:
  schedule:
    - cron: "45 4 14 11 *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  yayin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sayfayı, kartı ve akış öğesini ekle
        run: |
          git fetch origin yayin-14-kasim || exit 0
          git checkout origin/yayin-14-kasim -- kuresel-borc.html
          python3 - <<'PY'
          slug='kuresel-borc'
          title='Dünyanın Borcu: Ne Kadar Yüklendik, Nasıl Çıkılır?'
          desc='Küresel kamu borcu yüzde 100’e doğru giderken ülkelerin tarih boyunca denediği yollar: sabırlı mali ayar, enflasyonla eritme, yeniden yapılandırma ve büyüme.'
          i=open('index.html',encoding='utf-8').read()
          if slug+'.html' not in i:
              chips='<span class="chip c1">Ekonomi</span> <span class="chip c2">Tarih</span> <span class="chip c3">13 dk</span>'
              card='<li><a href="%s.html">%s</a><div class="m">14 Kasım 2026 &nbsp;%s</div></li>\n'%(slug,title,chips)
              open('index.html','w',encoding='utf-8').write(i.replace('</ol>',card+'</ol>',1))
          f=open('feed.xml',encoding='utf-8').read()
          if slug+'.html' not in f:
              item='<item>\n<title>%s</title>\n<link>https://thezngn.github.io/erken-okumalar/%s.html</link>\n<guid>https://thezngn.github.io/erken-okumalar/%s.html</guid>\n<pubDate>Sat, 14 Nov 2026 04:45:00 +0000</pubDate>\n<description>%s 13 dakikalık okuma.</description>\n</item>\n'%(title,slug,slug,desc)
              open('feed.xml','w',encoding='utf-8').write(f.replace('</channel>',item+'</channel>',1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "14 Kasım okuması (zamanlı yayın)"
          git pull --rebase -q && git push
          gh workflow run notify.yml
          gh workflow run email.yml -f check=false
        env:
          GH_TOKEN: ${{ github.token }}
